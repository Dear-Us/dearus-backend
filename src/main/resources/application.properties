spring.application.name=DearUsBack
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

dearus.auth.jwt.issuer=dearus
dearus.auth.jwt.secret-base64=${DEARUS_JWT_SECRET_BASE64}
dearus.auth.access-token-ttl=30m
dearus.auth.refresh-token-ttl=30d
dearus.auth.google.client-id=${GOOGLE_CLIENT_ID}
dearus.auth.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
dearus.auth.kakao.app-id=${KAKAO_APP_ID}
dearus.auth.kakao.base-url=https://kapi.kakao.com
dearus.auth.naver.base-url=https://openapi.naver.com

spring.application.name=DearUsBack
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
dearus.openapi.server-url=${DEARUS_OPENAPI_SERVER_URL:}

dearus.auth.jwt.issuer=dearus
dearus.auth.jwt.secret-base64=${DEARUS_JWT_SECRET_BASE64}
dearus.auth.access-token-ttl=30m
dearus.auth.refresh-token-ttl=30d
dearus.auth.google.client-id=${GOOGLE_CLIENT_ID:}
dearus.auth.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
dearus.auth.kakao.app-id=${KAKAO_APP_ID:0}
dearus.auth.kakao.base-url=https://kapi.kakao.com
dearus.auth.naver.base-url=https://openapi.naver.com

dearus.profile-image.storage.enabled=${PROFILE_IMAGE_STORAGE_ENABLED:false}
dearus.profile-image.storage.bucket=${PROFILE_IMAGE_STORAGE_BUCKET:}
dearus.profile-image.storage.region=${PROFILE_IMAGE_STORAGE_REGION:ap-northeast-2}
dearus.profile-image.storage.public-base-url=${PROFILE_IMAGE_STORAGE_PUBLIC_BASE_URL:}
dearus.profile-image.storage.endpoint=${PROFILE_IMAGE_STORAGE_ENDPOINT:}

dearus.baby-image.storage.enabled=${BABY_IMAGE_STORAGE_ENABLED:false}
dearus.baby-image.storage.bucket=${BABY_IMAGE_STORAGE_BUCKET:}
dearus.baby-image.storage.region=${BABY_IMAGE_STORAGE_REGION:ap-northeast-2}
dearus.baby-image.storage.public-base-url=${BABY_IMAGE_STORAGE_PUBLIC_BASE_URL:}
dearus.baby-image.storage.endpoint=${BABY_IMAGE_STORAGE_ENDPOINT:}
dearus.image.presigned-get-ttl=${DEARUS_IMAGE_PRESIGNED_GET_TTL:PT1H}

dearus.invitation.base-url=${DEARUS_INVITATION_BASE_URL:}
dearus.voice.enabled=${DEARUS_VOICE_ENABLED:false}
dearus.voice.max-audio-bytes=${DEARUS_VOICE_MAX_AUDIO_BYTES:5242880}
dearus.voice.google.credentials-json=${DEARUS_GOOGLE_CREDENTIALS_JSON:}
dearus.voice.google.project=${GOOGLE_CLOUD_PROJECT:}
dearus.voice.google.location=${GOOGLE_CLOUD_LOCATION:global}
dearus.voice.stt.enabled=${DEARUS_STT_ENABLED:false}
dearus.voice.stt.provider=${DEARUS_STT_PROVIDER:GOOGLE_SPEECH}
dearus.voice.stt.location=${DEARUS_STT_LOCATION:global}
dearus.voice.stt.language-code=${DEARUS_STT_LANGUAGE_CODE:ko-KR}
dearus.voice.stt.model=${DEARUS_STT_MODEL:short}
dearus.voice.stt.timeout-ms=${DEARUS_STT_TIMEOUT_MS:30000}
dearus.voice.llm.enabled=${DEARUS_LLM_ENABLED:false}
dearus.voice.llm.provider=${DEARUS_LLM_PROVIDER:VERTEX_GEMINI}
dearus.voice.openai.api-key=${OPENAI_API_KEY:}
dearus.voice.llm.model=${DEARUS_LLM_MODEL:gemini-2.5-flash}
dearus.voice.llm.timeout-ms=${DEARUS_LLM_TIMEOUT_MS:30000}

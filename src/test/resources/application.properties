dearus.auth.google.client-id=test-google-client
dearus.auth.google.jwk-set-uri=http://localhost/google-jwks
dearus.auth.kakao.app-id=1234
dearus.auth.kakao.base-url=http://localhost
dearus.auth.naver.base-url=http://localhost
